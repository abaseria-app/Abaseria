name: Deploy to GitHub Pages

# One site, two apps:
#   <base>       the live app, built from main, talking to abaseria-prod
#   <base>dev/   the test app, built from the dev branch, talking to abaseria-dev
# <base> is the APP_BASE_PATH Actions variable (Settings → Secrets and variables → Actions → Variables).
# Unset, it's /<repo>/ for the github.io address. With the custom domain app.abaseria.com it's /.
# Change it in the same sitting as Settings → Pages → Custom domain, then rerun this workflow.
# Pushing to main runs this. Pushing to dev runs dev.yml, which tests dev and then runs this on main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Live app (main)
      - run: npm ci
      - run: npm test
      - run: npm run test:schema
      - run: npm run build
        env:
          BASE_PATH: ${{ vars.APP_BASE_PATH || format('/{0}/', github.event.repository.name) }}
          # Production database. Set these under Settings → Secrets and variables → Actions → Variables.
          # Left empty, the app builds phone-only, as before.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_PROD_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PROD_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ENV: prod

      # Test app (dev branch, or main if there's no dev branch yet)
      - name: Get the dev branch
        run: |
          if git ls-remote --exit-code --heads origin dev >/dev/null; then
            git fetch --depth 1 origin dev
            git worktree add dev-src FETCH_HEAD
          else
            echo "No dev branch; building the test app from main."
            git worktree add dev-src HEAD
          fi
      - name: Build the test app
        working-directory: dev-src
        env:
          BASE_PATH: ${{ vars.APP_BASE_PATH || format('/{0}/', github.event.repository.name) }}dev/
        run: |
          npm ci
          # Dev database settings come from the branch's own .env.development.
          set -a; . ./.env.development; set +a
          npm run build -- --mode staging
          mkdir -p ../dist/dev
          cp -r dist/. ../dist/dev/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
