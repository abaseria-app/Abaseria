name: Test and publish the dev app

# Pushing to the dev branch tests it, then asks the Pages deploy (which only runs from main) to rebuild.
# The live app at /<repo>/ stays on main; only /<repo>/dev/ changes.

on:
  push:
    branches: [dev]

permissions:
  contents: read
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:schema

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
